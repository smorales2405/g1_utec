# G1 EDU-U6 de UTEC con las manos falsas (de goma) de Unitree: el teleop mueve solo los brazos. WiFi UTEC_H1_2:
# 192.168.0.152. Va en ese robot como ~/utec/teleoperacion/robot.conf (scripts_robot/README.md, §5).
NOMBRE="G1 .152 (manos de goma)"
MANOS=goma
IFACE=eth1              # la misma imagen que el .151: eth1 con 192.168.123.164 (visto el 2026-11-26)
D435I=262522074781      # comprobado el 2026-11-27 con pyrealsense2 (USB 2.1, firmware 5.15.1.55)
# Los dos G1 llevan la misma imagen clonada (misma clave de host SSH y, por cable, la misma 192.168.123.164): lo que
# los distingue es la MAC de wlan0 (ethtool -P wlan0). Con otra MAC, nada que mueva el robot arranca.
MAC_WIFI=f8:f6:b7:f1:79:76
