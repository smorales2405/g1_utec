# G1 EDU-U6 de UTEC con las manos Inspire RH56E2. WiFi UTEC_H1_2: 192.168.0.151.
# Va en ese robot como ~/utec/teleoperacion/robot.conf (scripts_robot/README.md, §5). Formato: config_robot.py
NOMBRE="G1 .151 (manos RH56E2)"
MANOS=rh56e2
IFACE=eth1              # comprobado el 2026-11-26
D435I=401622072718      # comprobado el 2026-11-26 (USB 2.1, firmware 5.15.1.55)
# Los dos G1 llevan la misma imagen clonada (misma clave de host SSH y, por cable, la misma 192.168.123.164): lo que
# los distingue es la MAC de wlan0 (ethtool -P wlan0). Con otra MAC, nada que mueva el robot arranca.
MAC_WIFI=f8:f6:b7:f1:61:82
